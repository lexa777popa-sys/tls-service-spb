services:
  - type: web
    name: tls-service-spb
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # На free-плане постоянного диска нет: заявки сохраняйте на ПК
    # кнопкой «Скачать на ПК» или scripts/backup-to-pc.ps1.
    # Когда перейдёте на Starter+, раскомментируйте disk и DATA_DIR:
    # disk:
    #   name: tls-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # - key: DATA_DIR
      #   value: /var/data
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        value: admin123
      - key: OPERATOR_LOGIN
        value: operator
      - key: OPERATOR_PASSWORD
        value: operator123
