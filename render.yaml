services:
  - type: web
    name: tls-service-spb
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: OPERATOR_LOGIN
        value: operator
      - key: OPERATOR_PASSWORD
        generateValue: true
